<svg xmlns="http://www.w3.org/2000/svg" width="960" height="422" viewBox="0 0 960 422" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Ship Log — recent public GitHub activity</title>
  <desc id="svg-desc">Five factual recent public commits, pushes, releases, or merged pull requests from GitHub.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#7B2FF7" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .display { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-weight: 800; letter-spacing: 2px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #C9D1D9; font-size: 15px; letter-spacing: 1.4px; }
      .value { fill: #FFFFFF; font-size: 22px; font-weight: 700; }
      .muted { fill: #C9D1D9; font-size: 14px; }
      .pulse-dot { animation: hudPulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .radar-sweep { animation: radarSweep 5s linear infinite; }
      .cursor { animation: cursorBlink 1.15s steps(1, end) infinite; }
      @keyframes hudPulse { 0%, 100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes radarSweep { 0% { transform: translateX(-720px); opacity: 0; } 12%, 88% { opacity: .65; } 100% { transform: translateX(720px); opacity: 0; } }
      @keyframes cursorBlink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse-dot, .radar-sweep, .cursor { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="960" height="422" rx="20" fill="#0D0221"/>
  <rect x="1.5" y="1.5" width="957" height="419" rx="18.5" fill="none" stroke="#39FF14" stroke-width="3"/>
  <rect x="12" y="12" width="936" height="398" rx="12" fill="url(#grid)"/>
  <rect width="960" height="422" rx="20" fill="url(#scanlines)"/>
  <text x="62" y="70" class="display" fill="#39FF14" font-size="30">SHIP LOG // RECENT PATCHES</text>
  <text x="898" y="68" text-anchor="end" class="mono" fill="#C9D1D9" font-size="13">PUBLIC GITHUB ACTIVITY // LATEST SIGNALS</text>
  <line x1="62" y1="91" x2="898" y2="91" stroke="#7B2FF7" stroke-width="2"/>
  <rect x="62" y="103" width="118" height="34" rx="5" fill="#241344" stroke="#00F0FF"/><text x="121" y="126" text-anchor="middle" class="mono" fill="#00F0FF" font-size="13" font-weight="700">2026-03-31</text><text x="206" y="126" class="mono" fill="#FFFFFF" font-size="16">[COMMIT]  MedInsight-NLP: Merge pull request #2 from sting-raider/main</text><rect x="62" y="161" width="118" height="34" rx="5" fill="#241344" stroke="#00F0FF"/><text x="121" y="184" text-anchor="middle" class="mono" fill="#00F0FF" font-size="13" font-weight="700">2026-03-20</text><text x="206" y="184" class="mono" fill="#FFFFFF" font-size="16">[COMMIT]  MedLingo: Image questions for mcq on datasets nullified</text><rect x="62" y="219" width="118" height="34" rx="5" fill="#241344" stroke="#00F0FF"/><text x="121" y="242" text-anchor="middle" class="mono" fill="#00F0FF" font-size="13" font-weight="700">2026-03-20</text><text x="206" y="242" class="mono" fill="#FFFFFF" font-size="16">[COMMIT]  MedLingo: feat: secure auth screen and implement mode-specific Fisher-Y…</text><rect x="62" y="277" width="118" height="34" rx="5" fill="#241344" stroke="#00F0FF"/><text x="121" y="300" text-anchor="middle" class="mono" fill="#00F0FF" font-size="13" font-weight="700">2026-03-20</text><text x="206" y="300" class="mono" fill="#FFFFFF" font-size="16">[COMMIT]  MedLingo: fix: add vercel.json to handle SPA routing</text><rect x="62" y="335" width="118" height="34" rx="5" fill="#241344" stroke="#00F0FF"/><text x="121" y="358" text-anchor="middle" class="mono" fill="#00F0FF" font-size="13" font-weight="700">2026-03-20</text><text x="206" y="358" class="mono" fill="#FFFFFF" font-size="16">[COMMIT]  MedLingo: Create README.md for MedLingo project</text>
</svg>
