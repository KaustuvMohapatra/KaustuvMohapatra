name: Update Player Save

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "profile/**"
      - "scripts/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: player-profile-generation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the main save slot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the minimal generator dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate live profile telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py

      - name: Validate generated profile
        run: python scripts/validate_profile.py

      - name: Commit a changed save slot
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/generated; then
            echo "Player save is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git commit -m "chore(profile): update player save"
          git pull --rebase origin main
          git push origin HEAD:main
