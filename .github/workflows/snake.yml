name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the main save slot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Generate themed light and dark snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: KaustuvMohapatra
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/generated/github-snake.svg?palette=github-light&color_snake=#7B2FF7&color_dots=#FFFFFF,#7B2FF7,#FF2E97,#00F0FF,#39FF14
            assets/generated/github-snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#0D0221,#7B2FF7,#FF2E97,#00F0FF,#39FF14

      - name: Commit changed snake frames
        shell: bash
        run: |
          if git diff --quiet -- assets/generated/github-snake.svg assets/generated/github-snake-dark.svg; then
            echo "Contribution snake is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/github-snake.svg assets/generated/github-snake-dark.svg
          git commit -m "chore(profile): update contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main

