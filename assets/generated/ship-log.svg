<svg xmlns="http://www.w3.org/2000/svg" width="960" height="422" viewBox="0 0 960 422" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Ship Log — recent public GitHub activity</title>
  <desc id="svg-desc">Five factual recent public commits, pushes, releases, or merged pull requests from GitHub.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#7B2FF7" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .display { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-weight: 800; letter-spacing: 2px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #C9D1D9; font-size: 15px; letter-spacing: 1.4px; }
      .value { fill: #FFFFFF; font-size: 22px; font-weight: 700; }
      .muted { fill: #C9D1D9; font-size: 14px; }
    </style>
  </defs>
  <rect width="960" height="422" rx="20" fill="#0D0221"/>
  <rect x="1.5" y="1.5" width="957" height="419" rx="18.5" fill="none" stroke="#39FF14" stroke-width="3"/>
  <rect x="12" y="12" width="936" height="398" rx="12" fill="url(#grid)"/>
  <rect width="960" height="422" rx="20" fill="url(#scanlines)"/>
  <text x="62" y="70" class="display" fill="#39FF14" font-size="30">SHIP LOG // RECENT PATCHES</text>
  <text x="898" y="68" text-anchor="end" class="mono" fill="#C9D1D9" font-size="13">PUBLIC GITHUB ACTIVITY // LATEST SIGNALS</text>
  <line x1="62" y1="91" x2="898" y2="91" stroke="#7B2FF7" stroke-width="2"/>
  <rect x="62" y="103" width="118" height="34" rx="5" fill="#241344" stroke="#FFB800"/><text x="121" y="126" text-anchor="middle" class="mono" fill="#FFB800" font-size="13" font-weight="700">2026-06-14</text><text x="206" y="126" class="mono" fill="#FFFFFF" font-size="16">[WORLD]  Public repository activity in Arena-Survivor</text><rect x="62" y="161" width="118" height="34" rx="5" fill="#241344" stroke="#FFB800"/><text x="121" y="184" text-anchor="middle" class="mono" fill="#FFB800" font-size="13" font-weight="700">2026-03-31</text><text x="206" y="184" class="mono" fill="#FFFFFF" font-size="16">[WORLD]  Public repository activity in MedInsight-NLP</text><rect x="62" y="219" width="118" height="34" rx="5" fill="#241344" stroke="#FFB800"/><text x="121" y="242" text-anchor="middle" class="mono" fill="#FFB800" font-size="13" font-weight="700">2026-03-25</text><text x="206" y="242" class="mono" fill="#FFFFFF" font-size="16">[WORLD]  Public repository activity in AI-Game-Asset-Maker</text><rect x="62" y="277" width="118" height="34" rx="5" fill="#241344" stroke="#FFB800"/><text x="121" y="300" text-anchor="middle" class="mono" fill="#FFB800" font-size="13" font-weight="700">2026-03-20</text><text x="206" y="300" class="mono" fill="#FFFFFF" font-size="16">[WORLD]  Public repository activity in MedLingo</text><rect x="62" y="335" width="118" height="34" rx="5" fill="#241344" stroke="#FFB800"/><text x="121" y="358" text-anchor="middle" class="mono" fill="#FFB800" font-size="13" font-weight="700">2025-11-26</text><text x="206" y="358" class="mono" fill="#FFFFFF" font-size="16">[WORLD]  Public repository activity in typemaker</text>
</svg>
