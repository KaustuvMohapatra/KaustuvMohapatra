name: Profile CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the minimal generator dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate deterministic fixture assets
        run: >-
          python scripts/generate_profile.py
          --fixture tests/fixtures/github.json
          --output-dir .profile-ci/generated
          --no-readme

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate config, SVG XML, README assets, and workflows
        run: python scripts/validate_profile.py --generated-dir .profile-ci/generated
