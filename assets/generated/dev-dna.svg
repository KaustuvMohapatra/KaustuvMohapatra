<svg xmlns="http://www.w3.org/2000/svg" width="960" height="498" viewBox="0 0 960 498" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Dev DNA — current engineering positioning</title>
  <desc id="svg-desc">An editable positioning map covering gameplay systems, AI, interactive web, tools, full stack work, and multiplayer.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#7B2FF7" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .display { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-weight: 800; letter-spacing: 2px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #C9D1D9; font-size: 15px; letter-spacing: 1.4px; }
      .value { fill: #FFFFFF; font-size: 22px; font-weight: 700; }
      .muted { fill: #C9D1D9; font-size: 14px; }
    </style>
  </defs>
  <rect width="960" height="498" rx="20" fill="#0D0221"/>
  <rect x="1.5" y="1.5" width="957" height="495" rx="18.5" fill="none" stroke="#FF2E97" stroke-width="3"/>
  <rect x="12" y="12" width="936" height="474" rx="12" fill="url(#grid)"/>
  <rect width="960" height="498" rx="20" fill="url(#scanlines)"/>
  <text x="62" y="70" class="display" fill="#FF2E97" font-size="30">DEV DNA // CURRENT BUILD</text>
  <text x="898" y="68" text-anchor="end" class="mono" fill="#C9D1D9" font-size="13">POSITIONING MAP // EDITABLE CONFIG</text>
  <line x1="62" y1="91" x2="898" y2="91" stroke="#7B2FF7" stroke-width="2"/>
  <text x="62" y="142" class="label mono">GAMEPLAY SYSTEMS</text><rect x="310" y="125" width="540" height="18" rx="4" fill="#241344" stroke="#463068"/><rect x="310" y="125" width="496" height="18" rx="4" fill="#00F0FF"/><text x="898" y="142" text-anchor="end" class="value mono">92</text><text x="62" y="200" class="label mono">AI / GENERATIVE AI</text><rect x="310" y="183" width="540" height="18" rx="4" fill="#241344" stroke="#463068"/><rect x="310" y="183" width="507" height="18" rx="4" fill="#FF2E97"/><text x="898" y="200" text-anchor="end" class="value mono">94</text><text x="62" y="258" class="label mono">INTERACTIVE WEB</text><rect x="310" y="241" width="540" height="18" rx="4" fill="#241344" stroke="#463068"/><rect x="310" y="241" width="475" height="18" rx="4" fill="#7B2FF7"/><text x="898" y="258" text-anchor="end" class="value mono">88</text><text x="62" y="316" class="label mono">TOOLS / PIPELINES</text><rect x="310" y="299" width="540" height="18" rx="4" fill="#241344" stroke="#463068"/><rect x="310" y="299" width="453" height="18" rx="4" fill="#39FF14"/><text x="898" y="316" text-anchor="end" class="value mono">84</text><text x="62" y="374" class="label mono">FULL STACK</text><rect x="310" y="357" width="540" height="18" rx="4" fill="#241344" stroke="#463068"/><rect x="310" y="357" width="442" height="18" rx="4" fill="#FFB800"/><text x="898" y="374" text-anchor="end" class="value mono">82</text><text x="62" y="432" class="label mono">MULTIPLAYER</text><rect x="310" y="415" width="540" height="18" rx="4" fill="#241344" stroke="#463068"/><rect x="310" y="415" width="367" height="18" rx="4" fill="#00F0FF"/><text x="898" y="432" text-anchor="end" class="value mono">68</text>
  <text x="62" y="472" class="mono" fill="#C9D1D9" font-size="12">Deliberately defined in profile/profile.yml — not an official GitHub measurement.</text>
</svg>
