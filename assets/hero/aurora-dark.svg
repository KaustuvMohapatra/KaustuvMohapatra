<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title desc">
<title id="title">Kaustuv Mohapatra — Creative Developer</title><desc id="desc">Editorial header with gently animated cyan, rose and violet aurora. Game development, AI and interactive systems.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09111F"/><stop offset="1" stop-color="#15112B"/></linearGradient>
<radialGradient id="cyan"><stop stop-color="#5BE4E1" stop-opacity=".70"/><stop offset="1" stop-color="#5BE4E1" stop-opacity="0"/></radialGradient>
<radialGradient id="lilac"><stop stop-color="#9978F6" stop-opacity=".76"/><stop offset="1" stop-color="#9978F6" stop-opacity="0"/></radialGradient>
<radialGradient id="rose"><stop stop-color="#ED8ABB" stop-opacity=".48"/><stop offset="1" stop-color="#ED8ABB" stop-opacity="0"/></radialGradient>
<linearGradient id="line" x1="0" x2="1"><stop stop-color="#65E8E4" stop-opacity="0"/><stop offset=".5" stop-color="#65E8E4" stop-opacity=".5"/><stop offset="1" stop-color="#B89DFF" stop-opacity=".05"/></linearGradient>
<pattern id="points" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.8" fill="#484062" opacity=".25"/></pattern>
<clipPath id="frame"><rect width="1200" height="390" rx="18"/></clipPath>
</defs><g clip-path="url(#frame)">
<rect width="1200" height="390" fill="url(#bg)"/><rect width="1200" height="390" fill="url(#points)"/>
<ellipse cx="875" cy="75" rx="425" ry="240" fill="url(#cyan)"><animate attributeName="cx" values="870;955;870" dur="24s" repeatCount="indefinite"/></ellipse>
<ellipse cx="1075" cy="285" rx="435" ry="295" fill="url(#lilac)"><animate attributeName="cy" values="285;205;285" dur="27s" repeatCount="indefinite"/></ellipse>
<ellipse cx="575" cy="395" rx="375" ry="155" fill="url(#rose)"><animate attributeName="cx" values="575;715;575" dur="31s" repeatCount="indefinite"/></ellipse>
<path d="M450 325 Q740 180 1200 240" fill="none" stroke="url(#line)" stroke-width="2" opacity=".64"/><path d="M525 366 Q940 145 1220 290" fill="none" stroke="#BBA6F1" stroke-width="1" opacity=".32"/>
<g fill="none" stroke="#484062" stroke-width="1" opacity=".35"><circle cx="1033" cy="143" r="79"/><circle cx="1033" cy="143" r="96"/><path d="M945 143H1121 M1033 54V232"/></g>
<g font-family="Arial,Helvetica,sans-serif"><text x="60" y="64" fill="#6BE6E4" font-size="16" letter-spacing="3.5" font-weight="700">DESIGN · CODE · INTERACTIVE WORLDS</text>
<text x="52" y="179" fill="#FCFBFF" font-size="82" letter-spacing="-3" font-weight="800">KAUSTUV</text>
<text x="56" y="248" fill="#FCFBFF" font-size="66" letter-spacing="-2" font-weight="800">MOHAPATRA</text>
<text x="61" y="297" fill="#B3BBD2" font-size="21" font-weight="500">GAME DEVELOPMENT   /   ARTIFICIAL INTELLIGENCE   /   CREATIVE TECH</text>
<line x1="61" y1="324" x2="681" y2="324" stroke="#6BE6E4" opacity=".47"/>
<text x="61" y="356" fill="#B3BBD2" font-size="17">Building systems that work beautifully — and worlds that feel alive.</text>
</g><g transform="translate(1033 143)"><circle r="59" fill="#09111F" opacity=".20"/><text y="15" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="43" fill="#FCFBFF">KM</text><circle cy="-70" r="4" fill="#6CEDE4"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle></g>
</g><rect x="1" y="1" width="1198" height="388" rx="17" fill="none" stroke="#484062" stroke-width="2"/>
<style>@media (prefers-reduced-motion: reduce){animate{display:none}}</style></svg>