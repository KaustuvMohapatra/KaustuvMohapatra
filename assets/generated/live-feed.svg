  <text x="525" y="116" class="mono" fill="#FF2E97" font-size="13" font-weight="700">RECENTLY PLAYED WORLDS</text>
  <line x1="480" y1="110" x2="480" y2="430" stroke="#463068"/>
  <text x="62" y="142" class="mono" fill="#00F0FF" font-size="12">2026-03-31</text><text x="164" y="142" class="mono" fill="#FFFFFF" font-size="14" font-weight="700">MedInsight-NLP</text><text x="164" y="162" class="mono" fill="#C9D1D9" font-size="12">Merge pull request #2 from sting-raider/m…</text><text x="62" y="200" class="mono" fill="#00F0FF" font-size="12">2026-03-20</text><text x="164" y="200" class="mono" fill="#FFFFFF" font-size="14" font-weight="700">MedLingo</text><text x="164" y="220" class="mono" fill="#C9D1D9" font-size="12">Image questions for mcq on datasets nulli…</text><text x="62" y="258" class="mono" fill="#00F0FF" font-size="12">2026-03-20</text><text x="164" y="258" class="mono" fill="#FFFFFF" font-size="14" font-weight="700">MedLingo</text><text x="164" y="278" class="mono" fill="#C9D1D9" font-size="12">feat: secure auth screen and implement mo…</text><text x="62" y="316" class="mono" fill="#00F0FF" font-size="12">2026-03-20</text><text x="164" y="316" class="mono" fill="#FFFFFF" font-size="14" font-weight="700">MedLingo</text><text x="164" y="336" class="mono" fill="#C9D1D9" font-size="12">fix: add vercel.json to handle SPA routing</text><text x="62" y="374" class="mono" fill="#00F0FF" font-size="12">2026-03-20</text><text x="164" y="374" class="mono" fill="#FFFFFF" font-size="14" font-weight="700">MedLingo</text><text x="164" y="394" class="mono" fill="#C9D1D9" font-size="12">Create README.md for MedLingo project</text><text x="525" y="142" class="mono" fill="#FFFFFF" font-size="14" font-weight="700">Arena-Survivor</text><text x="525" y="162" class="mono" fill="#C9D1D9" font-size="12">SHADERLAB // 82D AGO</text><text x="898" y="142" text-anchor="end" class="mono" fill="#FFB800" font-size="12">IDLE</text><text x="525" y="200" class="mono" fill="#FFFFFF" font-size="14" font-weight="700">MedInsight-NLP</text><text x="525" y="220" class="mono" fill="#C9D1D9" font-size="12">PYTHON // 157D AGO</text><text x="898" y="200" text-anchor="end" class="m